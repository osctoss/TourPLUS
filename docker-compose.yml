version: '3.8'

services:
  db:
    image: postgis/postgis:16-3.4
    container_name: tourplus_postgis
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-tourplus_db}
      POSTGRES_USER: ${POSTGRES_USER:-tourplus_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-tourplus_password}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-tourplus_user} -d ${POSTGRES_DB:-tourplus_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:

